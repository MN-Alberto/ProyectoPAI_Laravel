services:

  app:
    image: pai-app:latest          # imagen preconstruida desde el USB
    container_name: pai_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
      ollama:
        condition: service_started
    env_file:
      - .env
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: pai
      DB_USERNAME: usuario_pai
      DB_PASSWORD: paso1234
      OLLAMA_HOST: "http://ollama:11434"

  mysql:
    image: mysql:8.0               # imagen precargada desde el USB
    container_name: pai_mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password # Forzamos el plugin de autenticación para que funcione con Laravel, si no da error con sha256_password
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: pai
      MYSQL_USER: usuario_pai
      MYSQL_PASSWORD: paso1234
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 10s
      retries: 20

  ollama:
    image: ollama/ollama:latest    # imagen precargada desde el USB
    container_name: pai_ollama
    restart: unless-stopped
    environment:
      - OLLAMA_MAX_LOADED_MODELS=2
      - OLLAMA_KEEP_ALIVE=15m
    volumes:
      - ./ollama_data:/root/.ollama
    ports:
      - "11434:11434"

volumes:
  mysql_data:
